{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - BMV3 CDC</title>
    <link rel="icon" type="image/png" href="{% static 'core/image/bmv3_logo.png' %}">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            max-width: 100vw;
            overflow-x: hidden;
        }
        body {
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #ffffff;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 480px;
            padding: 35px 24px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
            box-sizing: border-box;
        }
        .logo {
            height: 80px;
            max-width: 100%;
            object-fit: contain;
            margin-bottom: 20px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
        }
        .icon {
            font-size: 3.5rem;
            margin-bottom: 15px;
            animation: float 3s ease-in-out infinite;
        }
        h1 {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 12px;
            color: #8FB977;
        }
        p {
            font-size: 0.92rem;
            line-height: 1.6;
            color: #e2e8f0;
            margin-bottom: 25px;
        }
        .retry-btn {
            background-color: #8FB977;
            color: #0f2027;
            border: none;
            padding: 12px 28px;
            border-radius: 25px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(143, 185, 119, 0.4);
            font-family: inherit;
        }
        .retry-btn:hover {
            background-color: #a3d18a;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(143, 185, 119, 0.6);
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <img class="logo" src="{% static 'core/image/bmv3_logo.png' %}" alt="BMV3 Logo">
        <div class="icon"><i class="fa-solid fa-wifi" style="color:#94a3b8;"></i></div>
        <h1>You are Offline</h1>
        <p>It seems you are not connected to the internet. Please check your network connection and try again to access the BMV3 Child Care Management System.</p>
        <button class="retry-btn" onclick="window.location.reload()">Retry Connection</button>
    </div>
</body>
</html>
